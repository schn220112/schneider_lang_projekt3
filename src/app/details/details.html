<div class="container mt-5">
  <div class="card p-4 shadow" *ngIf="user">

    <!-- ANSICHT -->
    <div *ngIf="!editMode">
      <div class="text-center mb-4">
        <img *ngIf="user.bild" [src]="user.bild" style="width:120px; height:120px; border-radius:50%; object-fit:cover;">
        <div *ngIf="!user.bild" style="width:120px; height:120px; border-radius:50%; background:#e0e0e0; display:flex; align-items:center; justify-content:center; font-size:3rem; margin:0 auto;">👤</div>
        <h3 class="mt-3">{{ user.name }}</h3>
        <span class="badge" [class.bg-primary]="user.role === 'Schüler'" [class.bg-success]="user.role === 'Lehrer'">
          {{ user.role }}
        </span>
      </div>

      <hr>

      <div class="mb-2">
        <strong>Geburtsdatum:</strong> {{ user.geburtsdatum || 'nicht angegeben' }}
      </div>
      <div class="mb-2" *ngIf="user.klasse">
        <strong>Klasse:</strong> {{ user.klasse }}
      </div>
      <div class="mb-2" *ngIf="user.abteilung">
        <strong>Abteilung:</strong> {{ user.abteilung }}
      </div>
      <div class="mb-2" *ngIf="user.faecher">
        <strong>Fächer:</strong> {{ user.faecher }}
      </div>
      <div class="mb-2">
        <strong>Email:</strong>
        <span style="cursor:pointer; text-decoration:underline;" (click)="copyEmail()" title="Klicken um zu kopieren">
          {{ user.email }}
        </span>
        <span *ngIf="emailCopied" class="text-success small ms-2">Kopiert!</span>
        </div>


      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-outline-secondary" (click)="goBack()">← Zurück</button>
        <button class="btn btn-primary" *ngIf="isOwnProfile" (click)="startEdit()">Bearbeiten</button>
      </div>
    </div>

    <!-- BEARBEITEN -->
    <div *ngIf="editMode">
      <h4 class="mb-4">Profil bearbeiten</h4>

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" id="editName" class="form-control" [value]="user.name">
      </div>
      <div class="mb-3">
        <label class="form-label">Geburtsdatum</label>
        <input type="date" id="editGeburtsdatum" class="form-control" [value]="user.geburtsdatum || ''">
      </div>
      <div class="mb-3" *ngIf="user.klasse !== undefined">
        <label class="form-label">Klasse</label>
        <input type="text" id="editKlasse" class="form-control" [value]="user.klasse">
      </div>

      <div class="mb-3" *ngIf="user.abteilung !== undefined">
        <label class="form-label">Abteilung</label>
        <select id="editAbteilung" class="form-select">
          <option value="Informationstechnologie" [selected]="user.abteilung === 'Informationstechnologie'">Informationstechnologie</option>
          <option value="Elektronik" [selected]="user.abteilung === 'Elektronik'">Elektronik</option>
          <option value="Elektrotechnik" [selected]="user.abteilung === 'Elektrotechnik'">Elektrotechnik</option>
          <option value="Informatik" [selected]="user.abteilung === 'Informatik'">Informatik</option>
          <option value="Abendschule" [selected]="user.abteilung === 'Abendschule'">Abendschule</option>
        </select>
      </div>

      <div class="mb-3" *ngIf="user.faecher !== undefined">
        <label class="form-label">Fächer</label>
        <input type="text" id="editFaecher" class="form-control" [value]="user.faecher">
      </div>

      <div class="mb-3">
        <label class="form-label">Profilbild ändern</label>
        <input type="file" id="editBild" class="form-control" accept="image/*">
      </div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-success" (click)="saveEdit()">Speichern</button>
        <button class="btn btn-outline-secondary" (click)="cancelEdit()">Abbrechen</button>
      </div>
    </div>

  </div>

  <div *ngIf="!user" class="text-muted mt-5">Laden...</div>
</div>

<app-header></app-header>

<div class="container mt-4">
  <h2 class="mb-3">Alle Profile</h2>

  <div class="mb-3">
    <input type="text" class="form-control" placeholder="Suchen..." (input)="onSearch($event)">
  </div>

  <div class="mb-3">
    <select class="form-select" (change)="onFilter($event)">
      <option value="">Alle</option>
      <option value="Schüler">Schüler</option>
      <option value="Lehrer">Lehrer</option>
    </select>
  </div>

  <div *ngIf="loading" class="text-muted">Laden...</div>

  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-3" *ngFor="let user of filteredUsers">
      <div class="card clickable p-3 d-flex flex-row align-items-center gap-3" (click)="goToDetail(user.id)">
        <img *ngIf="user.bild" [src]="user.bild" class="avatar-sm">
        <div *ngIf="!user.bild" class="avatar-sm avatar-placeholder">👤</div>
        <div class="fw-semibold">{{ user.name }}</div>
        <span class="ms-auto badge" [class.bg-primary]="user.role === 'Schüler'" [class.bg-success]="user.role === 'Lehrer'">
          {{ user.role }}
        </span>
      </div>
    </div>
  </div>

</div>

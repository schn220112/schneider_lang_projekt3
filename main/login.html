<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schul-App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- NAVBAR (nur sichtbar wenn eingeloggt) -->
<nav id="navbar" class="navbar navbar-dark bg-dark px-4 d-none">
    <span class="navbar-brand">Schul-App</span>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white" id="navUsername"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-5">

    <!-- LOGIN & REGISTRIERUNG (sichtbar wenn ausgeloggt) -->
    <div id="authSection">

        <!-- LOGIN -->
        <div class="card p-4 shadow mb-4">
            <h2 class="mb-4">Anmeldung</h2>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Benutzername</label>
                    <input type="text" id="loginName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Passwort</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                </div>

                <div id="loginError" class="alert alert-danger d-none">
                    Falscher Benutzername oder Passwort!
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>

        <!-- REGISTRIERUNG -->
        <div class="card p-4 shadow">
            <h2 class="mb-4">Registrierung</h2>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" id="registerName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Passwort</label>
                    <input type="password" id="registerPassword" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rolle</label>
                    <select id="role" class="form-select">
                        <option value="Schüler">Schüler</option>
                        <option value="Lehrer">Lehrer</option>
                    </select>
                </div>

                <div id="registerSuccess" class="alert alert-success d-none"></div>
                <div id="registerError" class="alert alert-danger d-none"></div>

                <button type="submit" class="btn btn-success">Registrieren</button>
            </form>
        </div>

    </div>

    <!-- HAUPTSEITE (sichtbar wenn eingeloggt) -->
    <div id="mainSection" class="d-none">
        <h3>Willkommen, <span id="welcomeName"></span>!</h3>
        <p class="text-muted">Du bist eingeloggt als <span id="welcomeRole"></span>.</p>
        <!-- Hier kommt später die Profilliste rein -->
    </div>

</div>

<script>

    // Benutzer werden hier lokal gespeichert (später Firebase)
    const users = [];

    // REGISTRIERUNG
    document.getElementById("registerForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const name     = document.getElementById("registerName").value.trim();
        const password = document.getElementById("registerPassword").value;
        const role     = document.getElementById("role").value;

        const successMsg = document.getElementById("registerSuccess");
        const errorMsg   = document.getElementById("registerError");

        // Prüfen ob Benutzer schon existiert
        const exists = users.find(u => u.name === name);
        if (exists) {
            errorMsg.textContent = "Benutzername bereits vergeben!";
            errorMsg.classList.remove("d-none");
            successMsg.classList.add("d-none");
            return;
        }

        // Benutzer speichern
        users.push({ name, password, role });

        successMsg.textContent = name + " wurde als " + role + " registriert! Du kannst dich jetzt einloggen.";
        successMsg.classList.remove("d-none");
        errorMsg.classList.add("d-none");

        document.getElementById("registerForm").reset();
    });


    // LOGIN
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const name     = document.getElementById("loginName").value.trim();
        const password = document.getElementById("loginPassword").value;
        const errorMsg = document.getElementById("loginError");

        const user = users.find(u => u.name === name && u.password === password);

        if (user) {
            errorMsg.classList.add("d-none");
            showMainPage(user);
        } else {
            errorMsg.classList.remove("d-none");
        }
    });


    // EINLOGGEN → Hauptseite zeigen
    function showMainPage(user) {
        document.getElementById("authSection").classList.add("d-none");
        document.getElementById("mainSection").classList.remove("d-none");
        document.getElementById("navbar").classList.remove("d-none");
        document.getElementById("navUsername").textContent = user.name + " (" + user.role + ")";
        document.getElementById("welcomeName").textContent = user.name;
        document.getElementById("welcomeRole").textContent = user.role;
        document.getElementById("loginForm").reset();
    }


    // LOGOUT → zurück zur Login-Seite
    function logout() {
        document.getElementById("mainSection").classList.add("d-none");
        document.getElementById("navbar").classList.add("d-none");
        document.getElementById("authSection").classList.remove("d-none");
    }

</script>

</body>
</html>

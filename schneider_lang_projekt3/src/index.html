<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schul-App – Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4">Anmeldung</h2>

        <div id="registeredMsg" class="alert alert-success d-none">
            Registrierung erfolgreich! Du kannst dich jetzt einloggen.
        </div>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Benutzername</label>
                <input type="text" id="loginName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Passwort</label>
                <input type="password" id="loginPassword" class="form-control" required>
            </div>

            <div id="loginError" class="alert alert-danger d-none">
                Falscher Benutzername oder Passwort!
            </div>

            <div class="d-flex gap-2 align-items-center">
                <button type="submit" class="btn btn-primary">Login</button>
                <a href="register.html" class="btn btn-outline-success">Registrieren</a>
            </div>

        </form>
    </div>
</div>

<script>

    const params = new URLSearchParams(window.location.search);
    if (params.get("registered") === "true") {
        document.getElementById("registeredMsg").classList.remove("d-none");
    }
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const name     = document.getElementById("loginName").value.trim();
        const password = document.getElementById("loginPassword").value;
        const errorMsg = document.getElementById("loginError");

        const users = JSON.parse(localStorage.getItem("users") || "[]");
        const user  = users.find(u => u.name === name && u.password === password);

        if (user) {
            localStorage.setItem("loggedInUser", JSON.stringify(user));
            window.location.href = "main.html";
        } else {
            errorMsg.classList.remove("d-none");
        }
    });

</script>

</body>
</html>

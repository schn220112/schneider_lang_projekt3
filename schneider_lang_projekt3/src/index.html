<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schul-App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

    <!-- LOGIN -->
    <div class="card p-4 shadow mb-5">
        <h2 class="mb-4">Anmeldung</h2>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Benutzername</label>
                <input type="text" id="loginName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Passwort</label>
                <input type="password" id="loginPassword" class="form-control" required>
            </div>

            <div id="errorMessage" class="alert alert-danger d-none">
                Falsches Passwort!
            </div>

            <button type="submit" class="btn btn-primary">
                Login
            </button>

        </form>
    </div>


    <!-- REGISTRIERUNG -->
    <div class="card p-4 shadow">
        <h2 class="mb-4">Registrierung</h2>

        <form id="registerForm">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" id="registerName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Rolle</label>

                <select id="role" class="form-select">
                    <option value="Schüler">Schüler</option>
                    <option value="Lehrer">Lehrer</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">
                Registrieren
            </button>

        </form>
    </div>

</div>

<script>

    // Hartcodiertes Passwort
    const correctPassword = "schule123";

    // LOGIN
    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const password = document.getElementById("loginPassword").value;
        const errorMessage = document.getElementById("errorMessage");

        if(password === correctPassword) {

            errorMessage.classList.add("d-none");

            alert("Login erfolgreich!");

        } else {

            errorMessage.classList.remove("d-none");

        }

    });


    // REGISTRIERUNG
    document.getElementById("registerForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("registerName").value;
        const role = document.getElementById("role").value;

        alert(name + " wurde als " + role + " registriert!");

    });

</script>

</body>
</html>

<div class="container mt-5">
  <div class="card p-4 shadow">
    <h2 class="mb-4">Registrierung</h2>

    <form (ngSubmit)="onSubmit($event)">

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Passwort</label>
        <input type="password" id="password" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Rolle</label>
        <select id="role" class="form-select" (change)="onRoleChange()">
          <option value="">-- Bitte wählen --</option>
          <option value="Schüler">Schüler</option>
          <option value="Lehrer">Lehrer</option>
        </select>
      </div>

      <!-- SCHÜLER FELDER -->
      <div id="schuelerFelder" style="display:none">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" id="schuelerName" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Klasse</label>
          <input type="text" id="schuelerKlasse" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Abteilung</label>
          <input type="text" id="schuelerAbteilung" class="form-control">
        </div>
      </div>

      <!-- LEHRER FELDER -->
      <div id="lehrerFelder" style="display:none">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" id="lehrerName" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Abteilung</label>
          <input type="text" id="lehrerAbteilung" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Fächer</label>
          <input type="text" id="lehrerFaecher" class="form-control" placeholder="z.B. Mathematik, Softwareentwicklung">
        </div>
      </div>

      <div id="registerError" class="alert alert-danger" style="display:none"></div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Registrieren</button>
        <a routerLink="/" class="btn btn-outline-secondary">Zurück zum Login</a>
      </div>

    </form>
  </div>
</div>

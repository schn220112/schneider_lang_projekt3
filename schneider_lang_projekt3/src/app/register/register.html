<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schul-App – Registrierung</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 shadow">
    <h2 class="mb-4">Registrierung</h2>

    <form id="registerForm">

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" id="registerName" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Passwort</label>
        <input type="password" id="registerPassword" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Rolle</label>
        <select id="role" class="form-select">
          <option value="Schüler">Schüler</option>
          <option value="Lehrer">Lehrer</option>
        </select>
      </div>

      <div id="registerError" class="alert alert-danger d-none"></div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Registrieren</button>
        <a href="index.html" class="btn btn-outline-secondary">Zurück zum Login</a>
      </div>

    </form>
  </div>
</div>

<script>

  document.getElementById("registerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name     = document.getElementById("registerName").value.trim();
    const password = document.getElementById("registerPassword").value;
    const role     = document.getElementById("role").value;
    const errorMsg = document.getElementById("registerError");

    const users = JSON.parse(localStorage.getItem("users") || "[]");

    const exists = users.find(u => u.name === name);
    if (exists) {
      errorMsg.textContent = "Benutzername bereits vergeben!";
      errorMsg.classList.remove("d-none");
      return;
    }

    users.push({ name, password, role });
    localStorage.setItem("users", JSON.stringify(users));

    window.location.href = "index.html?registered=true";
  });

</script>

</body>
</html>

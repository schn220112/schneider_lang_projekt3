<div class="container mt-5">
  <div class="card p-4 shadow">
    <h2 class="mb-4">Anmeldung</h2>

    <div id="registeredMsg" class="alert alert-success d-none">
      Registrierung erfolgreich! Du kannst dich jetzt einloggen.
    </div>

    <form id="loginForm">

      <div class="mb-3">
        <label class="form-label">Benutzername</label>
        <input type="text" id="loginName" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Passwort</label>
        <input type="password" id="loginPassword" class="form-control" required>
      </div>

      <div id="loginError" class="alert alert-danger d-none">
        Falscher Benutzername oder Passwort!
      </div>

      <div class="d-flex gap-2 align-items-center">
        <button type="submit" class="btn btn-primary">Login</button>
        <a routerLink="/register" class="btn btn-outline-success">Registrieren</a>
      </div>

    </form>
  </div>
</div>

<div class="container mt-5">
  <div class="card p-4 shadow" *ngIf="user">

    <div class="text-center mb-4">
      <img *ngIf="user.bild" [src]="user.bild" style="width:120px; height:120px; border-radius:50%; object-fit:cover;">
      <div *ngIf="!user.bild" style="width:120px; height:120px; border-radius:50%; background:#e0e0e0; display:flex; align-items:center; justify-content:center; font-size:3rem; margin:0 auto;">👤</div>
      <h3 class="mt-3">{{ user.name }}</h3>
      <span class="badge" [class.bg-primary]="user.role === 'Schüler'" [class.bg-success]="user.role === 'Lehrer'">
        {{ user.role }}
      </span>
    </div>

    <hr>

    <div class="mb-2" *ngIf="user.klasse">
      <strong>Klasse:</strong> {{ user.klasse }}
    </div>
    <div class="mb-2" *ngIf="user.abteilung">
      <strong>Abteilung:</strong> {{ user.abteilung }}
    </div>
    <div class="mb-2" *ngIf="user.faecher">
      <strong>Fächer:</strong> {{ user.faecher }}
    </div>
    <div class="mb-2">
      <strong>Email:</strong> {{ user.email }}
    </div>

    <button class="btn btn-outline-secondary mt-3" (click)="goBack()">← Zurück</button>

  </div>

  <div *ngIf="!user" class="text-muted mt-5">Laden...</div>
</div>

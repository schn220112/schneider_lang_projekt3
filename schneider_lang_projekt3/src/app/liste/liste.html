<div class="container mt-5">

  <div class="card p-4 shadow">
    <h2>Benutzerliste</h2>

    <table class="table">
      <thead>
      <tr>
        <th>Name</th>
        <th>Rolle</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let user of users">
        <td>
          <a href="#" (click)="showUser(user)">
            {{ user.name }}
          </a>
        </td>
        <td>{{ user.role }}</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="selectedUser" class="card p-4 shadow mt-4">
    <h3>Benutzerinformationen</h3>

    <p><strong>Name:</strong> {{ selectedUser.name }}</p>
    <p><strong>Rolle:</strong> {{ selectedUser.role }}</p>
  </div>

</div>
